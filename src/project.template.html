<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="title" content="{{PAPER_TITLE}} - {{AUTHOR_NAMES}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="keywords" content="{{KEYWORDS}}">
  <meta name="author" content="{{AUTHOR_NAMES}}">
  <meta name="robots" content="index, follow">
  <meta name="language" content="English">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{PAPER_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{PROJECT_URL}}">
  <meta property="og:image" content="{{SOCIAL_IMAGE}}">
  <meta property="og:image:alt" content="{{PAPER_TITLE}} - Research Preview">
  <meta property="article:published_time" content="{{PUBLISHED_TIME}}">
  <meta property="article:section" content="Research">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAPER_TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{SOCIAL_IMAGE}}">
  <meta name="twitter:image:alt" content="{{PAPER_TITLE}} - Research Preview">

  <meta name="citation_title" content="{{PAPER_TITLE}}">
  <meta name="citation_publication_date" content="{{YEAR}}">
  <meta name="citation_conference_title" content="{{VENUE}}">

  <meta name="theme-color" content="#2563eb">

  <title>{{PAPER_TITLE}}</title>

  <link rel="icon" type="image/svg+xml" href="../../static/images/github.svg">
  <link rel="apple-touch-icon" href="../../static/images/github.svg">

  <link rel="stylesheet" href="../../static/css/bulma.min.css">
  <link rel="stylesheet" href="../../static/css/index.css">
  <link rel="preload" href="../../static/css/bulma-carousel.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="../../static/css/bulma-slider.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <noscript>
    <link rel="stylesheet" href="../../static/css/bulma-carousel.min.css">
    <link rel="stylesheet" href="../../static/css/bulma-slider.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  </noscript>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script defer src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script defer src="../../static/js/fontawesome.all.min.js"></script>
  <script defer src="../../static/js/bulma-carousel.min.js"></script>
  <script defer src="../../static/js/bulma-slider.min.js"></script>
  <script defer src="../../static/js/index.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ScholarlyArticle",
    "headline": {{SCHEMA_TITLE}},
    "description": {{SCHEMA_DESCRIPTION}},
    "datePublished": {{SCHEMA_DATE}},
    "publisher": {
      "@type": "Organization",
      "name": {{SCHEMA_VENUE}}
    },
    "url": {{SCHEMA_URL}},
    "image": {{SCHEMA_IMAGE}},
    "keywords": {{SCHEMA_KEYWORDS}},
    "abstract": {{SCHEMA_ABSTRACT}},
    "isAccessibleForFree": true
  }
  </script>
</head>
<body>
  <button class="scroll-to-top" onclick="scrollToTop()" title="Scroll to top" aria-label="Scroll to top">
    <i class="fas fa-chevron-up"></i>
  </button>

  <main id="main-content">
    <section class="hero">
      <div class="hero-body">
        <div class="container is-max-desktop">
          <div class="columns is-centered">
            <div class="column has-text-centered">
              <h1 class="title is-1 publication-title">{{PAPER_TITLE}}</h1>
              <div class="is-size-5 publication-authors">
                {{AUTHORS_HTML}}
              </div>

              <div class="is-size-5 publication-authors">
                <span class="author-block">{{AFFILIATION_AND_VENUE_HTML}}</span>
                {{CONTRIBUTION_NOTES_HTML}}
              </div>

              <div class="column has-text-centered">
                <div class="publication-links">
{{PROJECT_LINKS_HTML}}
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="hero teaser">
      <div class="container is-max-desktop">
        <div class="hero-body">
{{TEASER_HTML}}
        </div>
      </div>
    </section>

    <section class="section hero is-light">
      <div class="container is-max-desktop">
        <div class="columns is-centered has-text-centered">
          <div class="column is-four-fifths">
            <h2 class="title is-3">Abstract</h2>
            <div class="content has-text-justified">
{{ABSTRACT_HTML}}
            </div>
          </div>
        </div>
      </div>
    </section>

{{EXTRA_HTML}}

  </main>

  <footer class="footer">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-8">
          <div class="content">
            <p>
              This page was built using the
              <a href="https://github.com/eliahuhorwitz/Academic-project-page-template" target="_blank" rel="noopener">Academic Project Page Template</a>,
              adopted from the <a href="https://nerfies.github.io" target="_blank" rel="noopener">Nerfies</a> project page.
            </p>
          </div>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
